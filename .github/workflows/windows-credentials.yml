name: Windows credential and update smoke test
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - runtime/**
      - connect.py
      - browser_input.py
      - windows_native_smoke.py
      - .github/tests/browser_input_chromium.cjs
      - .github/workflows/windows-credentials.yml
permissions:
  contents: read
jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test disposable native vault and local content update
        shell: pwsh
        run: python windows_native_smoke.py --accept-disposable-vault-test
      - name: Test native Chromium form submission
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false playwright@1.61.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHON = (Get-Command python).Source
          node --test .github/tests/browser_input_chromium.cjs
