name: Windows credential and update smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - runtime/**
      - connect.py
      - browser_input.py
      - windows_native_smoke.py
      - .github/workflows/windows-credentials.yml
permissions:
  contents: read
jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test disposable native vault and local content update
        shell: pwsh
        run: python windows_native_smoke.py --accept-disposable-vault-test
